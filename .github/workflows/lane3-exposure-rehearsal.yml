name: Lane 3 exposure rehearsal (refuses)

run-name: lane3 starter=${{ inputs.starter_revision }} candidate=${{ inputs.candidate_version }}

on:
  workflow_dispatch:
    inputs:
      starter_revision:
        description: Starter protected-main revision, 40 lowercase hex characters
        required: true
        type: string
      candidate_version:
        description: Candidate version, for example 0.4.0a2
        required: true
        type: string
      grant_ref:
        description: Opaque Gate-3 grant reference
        required: true
        type: string

permissions: {}

jobs:
  rehearse:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      group: lane3-exposure-protected
    environment: lane3-rehearsal-protected
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - name: Validate the dispatch grammar before anything else
        shell: python3 -I {0}
        env:
          STARTER_REVISION: ${{ inputs.starter_revision }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          import os
          import re
          import sys

          GRAMMAR = r"lane3 starter=(?P<starter>[0-9a-f]{40}) candidate=(?P<candidate>[0-9]+(?:\.[0-9]+){2}(?:(?:a|b|rc)[0-9]+)?)"

          title = (
              "lane3 starter="
              + os.environ.get("STARTER_REVISION", "")
              + " candidate="
              + os.environ.get("CANDIDATE_VERSION", "")
          )
          if re.fullmatch(GRAMMAR, title) is None:
              print("::error::dispatch inputs do not match the Lane 3 grammar; refusing")
              sys.exit(1)
          print("dispatch grammar accepted: " + title)
      - name: Prove the B7 OIDC-to-KV read, value-free
        env:
          STARTER_REVISION: ${{ inputs.starter_revision }}
        shell: python3 -I {0}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import sys
          import types

          # DRAFT supplier source pin only; this revision is not an admission decision.
          COMMIT = "8625c4defd22f223d103fc94cbb74064804fe065"
          MODULES = {
              "lane3_topology.py": "418c87cf6fdbb56d8d391f9efaf1c0ca7618fff1fcc43261e9266c05268e97a6",
              "lane3_topology_source.py": "83f590635439e8b5f2faa1d33f3a9ad430350b5dd976aacacba5c8cb088756db",
              "lane3_openbao_topology.py": "2315721bdcaa6f581b26b355c4e65bea0fdf69e5ebfa19431ca8467ea6c3151d",
              "lane3_github_oidc.py": "0472a5783aa68bea07f59191ad28a3d0f766616a2cc3b93e61bf25151c8f6135",
              "lane3_wireguard_topology.py": "356fef42f4304418b91dc795dfd7d99263469de07e501d421860168a5de1b06a",
              "lane3_broker_origin.py": "6b1ee5f5afa9fc5f3f2e2f748dbf3c015feee6bbdb69240df4f70ea4d98c41a9",
              "lane3_handoff_protocol.py": "acddc0c5ffa3eba1fce3ac17eac3e454f362d301934a720dc40473d8a93d47cd",
              "lane3_handoff_client.py": "a6123b5ed3a8ce2d2ca92ecc68d0b7086dbb4424a5a342b74ec728e52317e96d",
              "lane3_handoff_bootstrap.py": "861c72440f4f42e3323adcf05feebd43daa1875db826df6594f63ebeae0808ce"
          }
          BOOTSTRAP_DIGEST = "861c72440f4f42e3323adcf05feebd43daa1875db826df6594f63ebeae0808ce"
          RUN_ROOT = pathlib.Path("/run/dotmac-lane3-handoff")
          CONFIG = pathlib.Path("/etc/dotmac-lane3/openbao-wireguard.json")
          FIELDS = {
              "endpoint_address", "source_address", "interface",
              "expected_local_public_key", "expected_peer_public_key", "oidc_broker_origin",
          }
          EXPECTED_VERSION = 1


          def refuse(stage):
              print("::error::Lane 3 OIDC-to-KV read proof refused at " + stage)
              sys.exit(1)


          def oidc_validation_category(request_url, request_token, approved_origin, max_response):
              # Mirror the pinned supplier's checks in order; return fixed labels only.
              from urllib.parse import parse_qsl, urlsplit
              if not isinstance(approved_origin, str) or not isinstance(request_url, str):
                  return "oidc.validation.shape"
              try:
                  origin = urlsplit(approved_origin)
                  request = urlsplit(request_url)
                  if (
                      origin.scheme != "https"
                      or not origin.hostname
                      or not origin.hostname.endswith(".actions.githubusercontent.com")
                      or origin.netloc != origin.hostname
                      or origin.path
                      or origin.query
                      or origin.fragment
                      or origin.username is not None
                  ):
                      return "oidc.validation.configured_origin"
                  if request.scheme != origin.scheme:
                      return "oidc.validation.scheme"
                  if request.netloc != origin.netloc:
                      return "oidc.validation.netloc"
                  if (
                      not request.path.startswith("/")
                      or not request.path.endswith("/idtoken")
                      or request.fragment
                      or any(c.isspace() for c in request_url)
                  ):
                      return "oidc.validation.path"
                  try:
                      pairs = parse_qsl(
                          request.query, keep_blank_values=True, strict_parsing=True
                      )
                  except ValueError:
                      return "oidc.validation.query"
                  if len(pairs) != 1 or pairs[0][0] != "api-version" or not pairs[0][1]:
                      return "oidc.validation.query"
                  if (
                      not isinstance(request_token, str)
                      or not request_token
                      or len(request_token) > max_response
                      or any(c.isspace() for c in request_token)
                  ):
                      return "oidc.validation.credential"
                  return None
              except Exception:
                  return "oidc.validation.shape"


          def read_config(path):
              # Walk from / using pinned directory descriptors; never follow symlinks.
              directory = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for part in path.parts[1:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                      dir_fd=directory)
                      os.close(directory)
                      directory = child
                      info = os.fstat(directory)
                      if info.st_uid != 0 or info.st_mode & 0o022:
                          refuse("config.parent")
                  descriptor = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                       dir_fd=directory)
                  with os.fdopen(descriptor, "rb") as stream:
                      info = os.fstat(stream.fileno())
                      if not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                          refuse("config.ownership")
                      raw = stream.read(65537)
                      if len(raw) > 65536:
                          refuse("config.size")
                      return json.loads(raw)
              finally:
                  os.close(directory)


          def protected_directory(path):
              # Environment values are locators only. Walk every component from root.
              raw = str(path)
              if not raw.startswith("/") or "//" in raw or any(p in (".", "..") for p in raw.split("/")):
                  raise ValueError()
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
              directory = os.open("/", flags)
              try:
                  info = os.fstat(directory)
                  if info.st_uid != 0 or stat.S_IMODE(info.st_mode) & 0o022:
                      raise ValueError()
                  for part in raw.split("/")[1:]:
                      child = os.open(part, flags, dir_fd=directory)
                      os.close(directory)
                      directory = child
                      info = os.fstat(directory)
                      if info.st_uid != 0 or stat.S_IMODE(info.st_mode) & 0o022:
                          raise ValueError()
                  return directory
              except BaseException:
                  os.close(directory)
                  raise


          def protected_file(directory, name, mode, gid):
              descriptor = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC,
                                   dir_fd=directory)
              try:
                  info = os.fstat(descriptor)
                  if (not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_gid != gid
                          or stat.S_IMODE(info.st_mode) != mode or info.st_nlink != 1
                          or not 0 < info.st_size <= 1048576):
                      raise ValueError()
                  with os.fdopen(descriptor, "rb", closefd=False) as stream:
                      raw = stream.read(1048577)
                  after = os.fstat(descriptor)
                  if (len(raw) != info.st_size or (info.st_size, info.st_mtime_ns, info.st_ctime_ns)
                          != (after.st_size, after.st_mtime_ns, after.st_ctime_ns)):
                      raise ValueError()
                  return raw
              finally:
                  os.close(descriptor)


          def strict_record(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError()
                      result[key] = value
                  return result
              def reject(value):
                  raise ValueError()
              value = json.loads(raw, object_pairs_hook=pairs, parse_constant=reject)
              if type(value) is not dict:
                  raise ValueError()
              return value


          def verified_supplier():
              lease = os.environ.get("DOTMAC_LANE3_LEASE_ID", "")
              locator = os.environ.get("DOTMAC_LANE3_SUPPLIER_DIR", "")
              if re.fullmatch(r"[0-9a-f]{32}", lease) is None:
                  raise ValueError()
              lease_path = RUN_ROOT / lease
              supplier = lease_path / "supplier"
              # Compare raw text before Path can normalize traversal or separators.
              if locator != str(supplier):
                  raise ValueError()
              lfd = protected_directory(str(lease_path))
              try:
                  linfo = os.fstat(lfd)
                  if stat.S_IMODE(linfo.st_mode) != 0o750:
                      raise ValueError()
                  gid = linfo.st_gid
                  dfd = protected_directory(locator)
                  try:
                      dinfo = os.fstat(dfd)
                      if stat.S_IMODE(dinfo.st_mode) != 0o550 or dinfo.st_gid != gid:
                          raise ValueError()
                      manifest = strict_record(protected_file(dfd, "supplier-installation.json", 0o440, gid))
                      if (manifest.get("modules") != MODULES or manifest.get("starter_commit") != COMMIT
                              or set(os.listdir(dfd)) != set(MODULES) | {"supplier-installation.json"}):
                          raise ValueError()
                      raw = protected_file(dfd, "lane3_handoff_bootstrap.py", 0o440, gid)
                      if hashlib.sha256(raw).hexdigest() != BOOTSTRAP_DIGEST:
                          raise ValueError()
                      launch = strict_record(protected_file(lfd, "launch.json", 0o640, gid))
                  finally:
                      os.close(dfd)
              finally:
                  os.close(lfd)
              # Only the exact root-staged bootstrap bytes may execute before verification.
              bootstrap = types.ModuleType("lane3_handoff_bootstrap")
              bootstrap.__file__ = str(supplier / "lane3_handoff_bootstrap.py")
              sys.modules[bootstrap.__name__] = bootstrap
              exec(compile(raw, bootstrap.__file__, "exec"), bootstrap.__dict__)
              modules = bootstrap.load_verified_bundle(supplier, lease_path / "launch.json")
              # The trusted loader validates boot, original 45s launch budget, both digests,
              # all file hashes, exact closure and isolated imports before returning.
              return lease, gid, manifest, launch, modules


          try:
              lease, gid, installation, launch, modules = verified_supplier()
          except Exception:
              refuse("bootstrap")

          try:
              if os.environ.get("STARTER_REVISION") != COMMIT:
                  refuse("handoff.source")
              request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              client_module = modules["lane3_handoff_client"]
              expectation = client_module.LocalExpectation(
                  repository_id=int(os.environ["GITHUB_REPOSITORY_ID"]),
                  run_id=int(os.environ["GITHUB_RUN_ID"]),
                  run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
                  starter_commit=COMMIT,
                  admission_digest=installation["admission_digest"],
                  supplier_digest=installation["supplier_digest"],
              )
              # Numeric job/runner IDs and workflow blob are independently API-qualified
              # by the coordinator/controller. github.job is a key, never a numeric ID.
              client = client_module.HandoffClient(
                  lease_id=lease, run_root=str(RUN_ROOT), expected_uid=0, expected_gid=gid,
              )
              pinned = client.obtain_from_launch(request_url=request_url, expectation=expectation)
          except Exception:
              refuse("handoff")

          def proof_refused(stage):
              # Best effort only: an interrupted callback or record keeps UNKNOWN.
              # Never infer that a refused read proves no credential issuance.
              try:
                  client.record_proof("REFUSED")
              except Exception:
                  pass
              refuse(stage)


          # No token read, supplier construction, WireGuard inspection or KV call above.
          try:
              config = read_config(CONFIG)
          except (OSError, ValueError):
              refuse("config.read")
          if not isinstance(config, dict) or set(config) != FIELDS:
              refuse("config.fields")

          try:
              source_module = modules["lane3_topology_source"]
              topology_module = modules["lane3_topology"]
              oidc_module = modules["lane3_github_oidc"]
              validation = oidc_validation_category(
                  request_url,
                  os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", ""),
                  pinned.origin,
                  oidc_module.MAX_RESPONSE,
              )
              if validation is not None:
                  proof_refused(validation)
              source = source_module.wireguard_github_openbao_source(
                  # Fresh root read-only checks preserve the unprivileged NNP job.
                  wireguard_guard=client.wireguard_check,
                  oidc_request_started=client.token_request_started,
                  oidc_pinned=pinned,
                  require_pinned=True,
                  expected_version=EXPECTED_VERSION,
                  jwt_request_url=request_url,
                  jwt_request_token=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
                  oidc_broker_origin=pinned.origin,
                  endpoint_address=config["endpoint_address"],
                  source_address=config["source_address"],
                  interface=config["interface"],
                  expected_local_public_key=config["expected_local_public_key"],
                  expected_peer_public_key=config["expected_peer_public_key"],
              )
              reading = source.read()
              topology = topology_module.parse_topology_record(reading.record)
          except Exception as exc:
              # Fixed source-defined categories only; never print exception values.
              category = "unclassified"
              allowed = {
                  "transport.wireguard", "oidc.request", "transport.request",
                  "expected_version", "source.consumed", "deadline",
                  "jwt.supplier", "auth.response", "auth.expired",
                  "kv.response", "kv.metadata", "kv.record", "kv.schema",
                  "reader.operation", "response.duplicate_field",
                  "transport.endpoint", "transport.configuration", "transport.operation",
                  "transport.deadline", "transport.status", "transport.response_size",
                  "transport.response_shape",
              }
              if type(exc) is source_module.TopologySourceUnavailable:
                  for label in allowed:
                      if exc.reason == label:
                          category = label
                          break
              proof_refused("read." + category)
          if reading.kv_version != EXPECTED_VERSION:
              proof_refused("version")
          try:
              client.record_proof("BOUNDED_PROOF")
          except Exception:
              refuse("proof.record")
          print(json.dumps({
              "lane3_oidc_kv_read": "PASS",
              "kv_version": reading.kv_version,
              "structure": topology.structure(),
              "starter_commit": COMMIT,
              "gate0_accepted": False,
          }, sort_keys=True))
      - name: Refuse until Lane 3 execution is admitted
        shell: bash
        run: |
          echo "refusal-only launcher: no Gate-3 grant verification, private delivery or Lane 3 execution exists yet" >&2
          exit 1
